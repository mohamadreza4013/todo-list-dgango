{% load static %}

<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <!-- ==================================================
         DOCUMENT SETTINGS
    ================================================== -->

    <!-- Page character encoding -->
    <meta charset="UTF-8">


    <!-- Make the page responsive -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- Page title -->
    <title>
        ویرایش وظیفه - تسک‌فلو
    </title>


    <!-- ==================================================
         CSS
    ================================================== -->

    <!-- Main project CSS -->
    <link
        rel="stylesheet"
        href="{% static 'tasks/style.css' %}"
    >


    <!-- Calendar CSS -->
    <link
        rel="stylesheet"
        href="{% static 'calendar/calendar.css' %}"
    >

</head>


<body>

<div class="edit-page">


    <!-- ==================================================
         PAGE HEADER
    ================================================== -->

    <div class="page-header">


        <!-- Back to dashboard -->

        <a
            href="{% url 'home' %}"
            class="back-link"
        >
            ← بازگشت به داشبورد
        </a>


        <!-- Page title -->

        <h1>
            ویرایش وظیفه
        </h1>


        <!-- Page description -->

        <p>
            جزئیات وظیفه خود را به‌روزرسانی کنید.
        </p>

    </div>


    <!-- ==================================================
         EDIT TASK CARD
    ================================================== -->

    <div class="edit-card">


        <!-- ==================================================
             TASK INFORMATION
        ================================================== -->

        <div class="task-info">


            <!-- Task status -->

            <span
                class="status {% if todo.completed %}completed{% endif %}"
            >

                {% if todo.completed %}

                    انجام‌شده

                {% else %}

                    در انتظار

                {% endif %}

            </span>


            <!-- Task ID -->

            <span class="task-id">

                وظیفه شماره {{ todo.id }}

            </span>

        </div>


        <!-- ==================================================
             EDIT FORM
        ================================================== -->

        <form
            method="POST"
        >

            {% csrf_token %}


            <!-- ==================================================
                 TITLE
            ================================================== -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="title"
                >
                    عنوان وظیفه
                </label>


                <input
                    id="title"
                    class="form-input"
                    type="text"
                    name="title"
                    value="{{ todo.title }}"
                    placeholder="چه کاری باید انجام دهید؟"
                    required
                >

            </div>


            <!-- ==================================================
                 DESCRIPTION
            ================================================== -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="description"
                >
                    توضیحات
                </label>


                <textarea
                    id="description"
                    class="form-textarea"
                    name="description"
                    placeholder="توضیحات را اضافه کنید..."
                >{{ todo.description }}</textarea>

            </div>


            <!-- ==================================================
                 CATEGORY
            ================================================== -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="category"
                >
                    نوع وظیفه
                </label>


                <select
                    id="category"
                    class="form-input task-category-input"
                    name="category"
                >

                    <!-- Personal -->

                    <option
                        value="personal"
                        {% if todo.category == "personal" %}selected{% endif %}
                    >
                        شخصی
                    </option>


                    <!-- Public -->

                    <option
                        value="public"
                        {% if todo.category == "public" %}selected{% endif %}
                    >
                        عمومی
                    </option>

                </select>

            </div>


            <!-- ==================================================
                 START DATE
            ================================================== -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="start-date"
                >
                    تاریخ شروع
                </label>


                <input
                    type="text"
                    id="start-date"
                    class="form-input jalali-date-input"
                    name="start_date"
                    value="{{ start_date_jalali }}"
                    placeholder="انتخاب تاریخ شروع"
                    autocomplete="off"
                    readonly
                >

            </div>


            <!-- ==================================================
                 DEADLINE
            ================================================== -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="deadline"
                >
                    مهلت انجام
                </label>


                <input
                    type="text"
                    id="deadline"
                    class="form-input jalali-date-input"
                    name="deadline"
                    value="{{ deadline_jalali }}"
                    placeholder="انتخاب مهلت"
                    autocomplete="off"
                    readonly
                >

            </div>


            <!-- ==================================================
                 FORM ACTIONS
            ================================================== -->

            <div class="form-actions">


                <!-- Cancel -->

                <a
                    href="{% url 'home' %}"
                    class="cancel-button"
                >
                    لغو
                </a>


                <!-- Save -->

                <button
                    type="submit"
                    class="save-button"
                >
                    ذخیره تغییرات
                </button>

            </div>

        </form>

    </div>

</div>


<!-- ==================================================
     CALENDAR PICKER MODAL
================================================== -->

<div
    id="calendar-picker-modal"
    class="calendar-picker-modal"
    hidden
>


    <!-- ==================================================
         CALENDAR OVERLAY
    ================================================== -->

    <div
        class="calendar-picker-overlay"
    ></div>


    <!-- ==================================================
         CALENDAR CONTAINER
    ================================================== -->

    <div
        class="calendar-picker-container"
    >


        <!-- Close calendar -->

        <button
            type="button"
            id="calendar-picker-close"
            class="calendar-picker-close"
            aria-label="بستن تقویم"
        >
            ×
        </button>


        <!-- ==================================================
             CALENDAR HEADER
        ================================================== -->

        <div
            class="calendar-picker-header"
        >

            <h2>
                انتخاب تاریخ
            </h2>

        </div>


        <!-- ==================================================
             CALENDAR
        ================================================== -->

        <div class="calendar">


            <!-- ==================================================
                 CALENDAR NAVIGATION
            ================================================== -->

            <div
                class="calendar-topbar"
            >


                <!-- Previous month -->

                <button
                    type="button"
                    id="previous-month"
                    class="month-button"
                    aria-label="ماه قبل"
                >
                    ‹
                </button>


                <!-- Current month -->

                <div
                    id="month-title"
                    class="month-title"
                ></div>


                <!-- Next month -->

                <button
                    type="button"
                    id="next-month"
                    class="month-button"
                    aria-label="ماه بعد"
                >
                    ›
                </button>

            </div>


            <!-- ==================================================
                 WEEKDAYS
            ================================================== -->

            <div
                id="weekdays"
                class="weekdays"
            ></div>


            <!-- ==================================================
                 CALENDAR DAYS
            ================================================== -->

            <div
                id="calendar-grid"
                class="calendar-grid"
            ></div>

        </div>

    </div>

</div>


<!-- ==================================================
     JAVASCRIPT
================================================== -->

<!-- Jalali calendar -->
<script
    src="{% static 'calendar/calendar.js' %}"
></script>


</body>

</html>
