{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <!-- ==================================================
         DOCUMENT SETTINGS
    ================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ویرایش وظیفه - تسک‌فلو
    </title>


    <!-- ==================================================
         CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="{% static 'tasks/style.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'calendar/calendar.css' %}"
    >

</head>


<body>

<div class="edit-page">


    <!-- ==================================================
         PAGE HEADER
    ================================================== -->

    <div class="page-header">


        <!-- Back to dashboard -->

        <a
            href="{% url 'home' %}"
            class="back-link"
        >
            ← بازگشت به داشبورد
        </a>


        <!-- Page title -->

        <h1>
            ویرایش وظیفه
        </h1>


        <!-- Page description -->

        <p>
            جزئیات وظیفه خود را به‌روزرسانی کنید.
        </p>

    </div>



    <!-- ==================================================
         EDIT TASK CARD
    ================================================== -->

    <div class="edit-card">


        <!-- ==================================================
             TASK INFORMATION
        ================================================== -->

        <div class="task-info">


            <!-- Task status -->

            <span
                class="status {% if todo.completed %}completed{% endif %}"
            >

                {% if todo.completed %}

                    انجام‌شده

                {% else %}

                    در انتظار

                {% endif %}

            </span>


            <!-- Task ID -->

            <span class="task-id">

                وظیفه شماره {{ todo.id }}

            </span>

        </div>



        <!-- ==================================================
             EDIT FORM
        ================================================== -->

        <form
            method="POST"
            id="edit-task-form"
        >

            {% csrf_token %}



            <!-- ==================================================
                 TITLE
            ================================================== -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="title"
                >
                    عنوان وظیفه
                </label>


                <input
                    id="title"
                    class="form-input"
                    type="text"
                    name="title"
                    value="{{ todo.title }}"
                    placeholder="چه کاری باید انجام دهید؟"
                    required
                >

            </div>



            <!-- ==================================================
                 DESCRIPTION
            ================================================== -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="description"
                >
                    توضیحات
                </label>


                <textarea
                    id="description"
                    class="form-textarea"
                    name="description"
                    placeholder="توضیحات را اضافه کنید..."
                >{{ todo.description }}</textarea>

            </div>



            <!-- ==================================================
                 CATEGORY
            ================================================== -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="category"
                >
                    نوع وظیفه
                </label>


                <select
                    id="category"
                    class="form-input task-category-input"
                    name="category"
                >

                    <option
                        value="personal"
                        {% if todo.category == "personal" %}
                            selected
                        {% endif %}
                    >
                        شخصی
                    </option>


                    <option
                        value="public"
                        {% if todo.category == "public" %}
                            selected
                        {% endif %}
                    >
                        عمومی
                    </option>

                </select>

            </div>



            <!-- ==================================================
                 TOPIC
            ================================================== -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="topic"
                >
                    موضوع
                </label>


                <div class="topic-input-row">

                    <select
                        id="topic"
                        class="form-input task-topic-input"
                        name="topic"
                    >


                        <!-- ==================================================
                             PERSONAL TOPICS
                        ================================================== -->

                        {% for topic in personal_topics %}

                            <option
                                value="{{ topic.id }}"
                                data-category="personal"
                                {% if todo.topic_id == topic.id %}
                                    selected
                                {% endif %}
                            >

                                {{ topic.name }}

                            </option>

                        {% endfor %}



                        <!-- ==================================================
                             PUBLIC TOPICS
                        ================================================== -->

                        {% for topic in public_topics %}

                            <option
                                value="{{ topic.id }}"
                                data-category="public"
                                {% if todo.topic_id == topic.id %}
                                    selected
                                {% endif %}
                            >

                                {{ topic.name }}

                            </option>

                        {% endfor %}

                    </select>


                    <!-- Create new topic -->

                    <button
                        type="button"
                        id="create-topic-button"
                        class="create-topic-button"
                    >

                        + موضوع جدید

                    </button>

                </div>

            </div>



            <!-- ==================================================
                 START DATE
            ================================================== -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="start-date"
                >
                    تاریخ شروع
                </label>


                <input
                    type="text"
                    id="start-date"
                    class="form-input jalali-date-input"
                    name="start_date"
                    value="{{ start_date_jalali }}"
                    placeholder="انتخاب تاریخ شروع"
                    autocomplete="off"
                    readonly
                >

            </div>



            <!-- ==================================================
                 DEADLINE
            ================================================== -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="deadline"
                >
                    مهلت انجام
                </label>


                <input
                    type="text"
                    id="deadline"
                    class="form-input jalali-date-input"
                    name="deadline"
                    value="{{ deadline_jalali }}"
                    placeholder="انتخاب مهلت"
                    autocomplete="off"
                    readonly
                >

            </div>



            <!-- ==================================================
                 FORM ACTIONS
            ================================================== -->

            <div class="form-actions">


                <!-- Cancel -->

                <a
                    href="{% url 'home' %}"
                    class="cancel-button"
                >

                    لغو

                </a>


                <!-- Save -->

                <button
                    type="submit"
                    class="save-button"
                >

                    ذخیره تغییرات

                </button>

            </div>

        </form>

    </div>

</div>



<!-- ==================================================
     CREATE TOPIC MODAL
================================================== -->

<div
    id="create-topic-modal"
    class="create-topic-modal"
    hidden
>

    <div class="create-topic-overlay"></div>


    <div class="create-topic-container">


        <!-- Close button -->

        <button
            type="button"
            id="create-topic-close"
            class="create-topic-close"
            aria-label="بستن"
        >

            ×

        </button>


        <!-- Modal title -->

        <h2>
            ایجاد موضوع جدید
        </h2>


        <!-- Topic name -->

        <input
            type="text"
            id="new-topic-name"
            class="new-topic-input"
            placeholder="مثلاً ورزش"
            maxlength="50"
            autocomplete="off"
        >


        <!-- Topic actions -->

        <div class="create-topic-actions">


            <button
                type="button"
                id="cancel-topic-button"
                class="cancel-topic-button"
            >

                انصراف

            </button>


            <button
                type="button"
                id="save-topic-button"
                class="save-topic-button"
            >

                ایجاد موضوع

            </button>

        </div>


        <!-- Topic error -->

        <div
            id="create-topic-error"
            class="create-topic-error"
            hidden
        ></div>

    </div>

</div>



<!-- ==================================================
     CALENDAR PICKER MODAL
================================================== -->

<div
    id="calendar-picker-modal"
    class="calendar-picker-modal"
    hidden
>

    <!-- Calendar overlay -->

    <div
        class="calendar-picker-overlay"
    ></div>


    <!-- Calendar container -->

    <div
        class="calendar-picker-container"
    >


        <!-- Close calendar -->

        <button
            type="button"
            id="calendar-picker-close"
            class="calendar-picker-close"
            aria-label="بستن تقویم"
        >

            ×

        </button>


        <!-- Calendar header -->

        <div
            class="calendar-picker-header"
        >

            <h2>
                انتخاب تاریخ
            </h2>

        </div>


        <!-- Calendar -->

        <div class="calendar">


            <!-- Calendar navigation -->

            <div
                class="calendar-topbar"
            >


                <!-- Previous month -->

                <button
                    type="button"
                    id="previous-month"
                    class="month-button"
                    aria-label="ماه قبل"
                >

                    ‹

                </button>


                <!-- Current month -->

                <div
                    id="month-title"
                    class="month-title"
                ></div>


                <!-- Next month -->

                <button
                    type="button"
                    id="next-month"
                    class="month-button"
                    aria-label="ماه بعد"
                >

                    ›

                </button>

            </div>


            <!-- Weekdays -->

            <div
                id="weekdays"
                class="weekdays"
            ></div>


            <!-- Calendar days -->

            <div
                id="calendar-grid"
                class="calendar-grid"
            ></div>

        </div>

    </div>

</div>



<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script
    src="{% static 'calendar/calendar.js' %}"
></script>


<script
    src="{% static 'tasks/todo.js' %}"
></script>

<script
    src="{% static 'tasks/edit_todo.js' %}"
></script>

</body>

</html>
