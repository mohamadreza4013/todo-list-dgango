<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task - TaskFlow</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        /* =========================
           Layout
        ========================= */

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* =========================
           Sidebar
        ========================= */

        .sidebar {
            width: 250px;
            background: #111827;
            color: white;
            padding: 28px 18px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            margin-bottom: 45px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
        }

        .logo span {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .nav-title {
            color: #6b7280;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 12px;
            margin-bottom: 10px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 9px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-item:hover {
            background: #1f2937;
            color: white;
        }

        .nav-item.active {
            background: #6366f1;
            color: white;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .profile {
            border-top: 1px solid #1f2937;
            padding-top: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #374151;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
        }

        .profile-name {
            font-size: 13px;
            font-weight: 600;
        }

        .profile-email {
            font-size: 11px;
            color: #6b7280;
        }

        /* =========================
           Main
        ========================= */

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 35px 45px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #6b7280;
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 18px;
            transition: 0.2s;
        }

        .back-link:hover {
            color: #6366f1;
        }

        .page-header h1 {
            font-size: 30px;
            letter-spacing: -1px;
            margin-bottom: 6px;
        }

        .page-header p {
            color: #6b7280;
            font-size: 14px;
        }

        /* =========================
           Edit Card
        ========================= */

        .edit-card {
            max-width: 760px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            border-radius: 10px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 14px;
            color: #1f2937;
            outline: none;
            transition: 0.2s;
        }

        .form-input:focus,
        .form-textarea:focus {
            background: white;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-textarea {
            min-height: 130px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            padding-top: 10px;
            border-top: 1px solid #f0f1f3;
        }

        .cancel-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 18px;
            border: 1px solid #e5e7eb;
            background: white;
            color: #6b7280;
            border-radius: 9px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }

        .cancel-button:hover {
            background: #f9fafb;
            color: #374151;
        }

        .save-button {
            border: none;
            background: #6366f1;
            color: white;
            padding: 12px 20px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
            transition: 0.2s;
        }

        .save-button:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }

        /* =========================
           Task Info
        ========================= */

        .task-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .status {
            font-size: 11px;
            padding: 5px 9px;
            border-radius: 20px;
            background: #fef3c7;
            color: #92400e;
        }

        .status.completed {
            background: #dcfce7;
            color: #166534;
        }

        .task-id {
            font-size: 11px;
            color: #9ca3af;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 900px) {

            .sidebar {
                width: 210px;
            }

            .main {
                margin-left: 210px;
                width: calc(100% - 210px);
                padding: 25px;
            }
        }

        @media (max-width: 650px) {

            .sidebar {
                display: none;
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }

            .page-header h1 {
                font-size: 24px;
            }

            .edit-card {
                padding: 22px;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .cancel-button,
            .save-button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">✓</div>
            <span>TaskFlow</span>
        </div>

        <div class="nav-title">Workspace</div>

        <nav class="nav">

            <a href="{% url 'home' %}" class="nav-item">
                <span>▦</span>
                Dashboard
            </a>

            <a href="#" class="nav-item active">
                <span>✓</span>
                My Tasks
            </a>

            <a href="#" class="nav-item">
                <span>★</span>
                Important
            </a>

        </nav>

        <div class="sidebar-bottom">

            <div class="nav">

                <a href="#" class="nav-item">
                    <span>⚙</span>
                    Settings
                </a>

            </div>

            <div class="profile">

                <div class="avatar">
                    MR
                </div>

                <div class="profile-info">

                    <span class="profile-name">
                        Mohammadreza
                    </span>

                    <span class="profile-email">
                        My account
                    </span>

                </div>

            </div>

        </div>

    </aside>


    <!-- Main -->

    <main class="main">

        <div class="page-header">

            <a href="{% url 'home' %}" class="back-link">
                ← Back to Dashboard
            </a>

            <h1>Edit Task</h1>

            <p>
                Update the details of your task.
            </p>

        </div>


        <div class="edit-card">

            <div class="task-info">

                <span class="status {% if todo.completed %}completed{% endif %}">
                    {% if todo.completed %}
                        Completed
                    {% else %}
                        Pending
                    {% endif %}
                </span>

                <span class="task-id">
                    Task #{{ todo.id }}
                </span>

            </div>


            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label class="form-label" for="title">
                        Task title
                    </label>

                    <input
                        id="title"
                        class="form-input"
                        type="text"
                        name="title"
                        value="{{ todo.title }}"
                        placeholder="What do you need to do?"
                        required
                    >

                </div>


                <div class="form-group">

                    <label class="form-label" for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        class="form-textarea"
                        name="description"
                        placeholder="Add a description..."
                    >{{ todo.description }}</textarea>

                </div>


                <div class="form-actions">

                    <a
                        href="{% url 'home' %}"
                        class="cancel-button"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="save-button"
                    >
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
```
