{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <!-- Set the character encoding -->
    <meta charset="UTF-8">

    <!-- Make the page responsive on different screen sizes -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Set the page title -->
    <title>My Calendar</title>

    <!-- Load the calendar page stylesheet -->
    <link
        rel="stylesheet"
        href="{% static 'mycalendar/calendar.css' %}"
    >

</head>

<body>

<!-- Main calendar page container -->

<div class="calendar-page">

    <!-- =========================
         Calendar Header
         ========================= -->

    <div class="calendar-header">

        <!-- Calendar page title -->

        <h1>
            My Calendar
        </h1>

        <!-- Calendar description -->

        <p>
            تقویم شمسی
        </p>

    </div>


    <!-- =========================
         Calendar
         ========================= -->

    <div class="calendar">

        <!-- Calendar navigation bar -->

        <div class="calendar-topbar">

            <!-- Button for navigating to the previous month -->

            <button
                id="previous-month"
                class="month-button"
            >
                ‹
            </button>

            <!-- Display the current month and year -->

            <div
                id="month-title"
                class="month-title"
            ></div>

            <!-- Button for navigating to the next month -->

            <button
                id="next-month"
                class="month-button"
            >
                ›
            </button>

        </div>


        <!-- =========================
             Weekdays
             ========================= -->

        <!-- JavaScript dynamically generates the weekday names here -->

        <div
            id="weekdays"
            class="weekdays"
        ></div>


        <!-- =========================
             Calendar Grid
             ========================= -->

        <!-- JavaScript dynamically generates the calendar days here -->

        <div
            id="calendar-grid"
            class="calendar-grid"
        ></div>

    </div>


    <!-- =========================
         Selected Date
         ========================= -->

    <!-- Displays the date selected by the user -->

    <div
        id="selected-date"
        class="selected-date"
    >
        تاریخی انتخاب نشده است
    </div>

</div>


<!-- Load the JavaScript file responsible for calendar functionality -->

<script src="{% static 'mycalendar/calendar.js' %}"></script>

</body>
</html>
